# Using a non-default storage class is kinda tricky
# Had to add a route in the provisioner kubectl -n kube-system edit configmap local-path-config    
# This is because k8s by default doesn't know of any other path to provision storage for
# So when you request a PVC with a specific storageClass, k8s has no idea where that lives
# Right now it looks like
#  {
#       "nodePathMap":[
#       {
#         "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
#         "paths":["/var/lib/rancher/k3s/storage"]
#       },
#       {
#         "node":"homelab",
#         "paths":["/media/chungus/dynamic-storage"]
#       }
#       ]
#     }
# And apply by kubectl -n kube-system rollout restart deployment local-path-provisioner


apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cold-storage
provisioner: rancher.io/local-path
parameters:
  nodePath: /media/chungus/dynamic-storage
reclaimPolicy: Retain # Persist data in case I delete a pvc
volumeBindingMode: WaitForFirstConsumer